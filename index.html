<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Erro Fatal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  
  html, body {
    height: 100%; width: 100%; position: fixed; overflow: hidden;
    background: #000; font-family: 'Courier New', monospace; cursor: none;
    touch-action: none; overscroll-behavior: none; margin: 0; top: 0; left: 0;
  }
  
  #start-screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0a0a0a;color:#ccc;z-index:9998;text-align:center;padding:20px;
  }
  #start-btn{
    margin-top:20px;padding:15px 40px;font-size:1.2rem;font-weight:bold;font-family:inherit;
    background:#d00;color:#fff;border:none;border-radius:5px;cursor:pointer;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,0,0,0.7);}70%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,0,0,0);}100%{transform:scale(1);}}

  #lock-screen{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#000;z-index:9999;color:#f00;text-align:center;width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #lock-screen.active{display:flex;}

  .glitch{
    font-size:clamp(2.5rem,10vw,5rem);font-weight:900;text-transform:uppercase;
    text-shadow:3px 3px 0 #0f0, -3px -3px 0 #00f; animation:glitch-anim 0.1s infinite;
  }
  .sub-text{font-size:1.2rem;color:#aaa;margin-top:15px;letter-spacing:3px;}
  .timer{font-size:6rem;color:#fff;margin-top:20px;font-weight:bold;}
  
  @keyframes glitch-anim{
    0%{transform:translate(0)}20%{transform:translate(-5px,5px)}40%{transform:translate(-5px,-5px)}
    60%{transform:translate(5px,5px)}80%{transform:translate(5px,-5px)}100%{transform:translate(0)}
  }

  #lock-screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 50%);
    background-size:100% 4px;z-index:10000;opacity:0.6; animation:flicker 0.1s infinite;
  }
  @keyframes flicker{0%{opacity:0.5;}50%{opacity:0.7;}100%{opacity:0.5;}}

  #escape{
    position:absolute;bottom:20px;left:20px;width:50px;height:50px;
    background:transparent;border:none;cursor:pointer;z-index:10001;opacity:0;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1 style="font-size:2rem;margin-bottom:10px; color:#f00; text-shadow: 0 0 10px red;">CHUKITOS</h1>
  <p style="color:#777;">Seu celular foi hackeado.</p>
  <button id="start-btn">INICIAR HACK</button>
</div>

<div id="lock-screen">
  <div class="glitch" id="glitch-text">SISTEMA TRAVADO</div>
  <div class="sub-text">ERRO CRÍTICO 0x000000</div>
  <div class="timer" id="timer">15</div>
  <button id="escape"></button>
</div>

<script>
(function(){
  const startScreen = document.getElementById('start-screen');
  const startBtn    = document.getElementById('start-btn');
  const lockScreen  = document.getElementById('lock-screen');
  const timerEl     = document.getElementById('timer');
  const glitchText  = document.getElementById('glitch-text');
  const escapeBtn   = document.getElementById('escape');
  
  let audioCtx, osc, lfo;
  let timerInterval, vibInterval, lockLoop;
  const DURACAO = 15; // <-- Tempo aumentado para 15s
  let segundosRestantes = DURACAO;
  let isActive = false;

  function tocarSirene() {
    try {
      if (!audioCtx || audioCtx.state === 'suspended') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.value = 120; 
        lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 5; lfoGain.gain.value = 80;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.15; osc.start(); lfo.start();
      }
    } catch(e) {}
  }

  function pararAudio() {
    try { if(osc) osc.stop(); if(audioCtx) audioCtx.close(); audioCtx = null; } catch(e) {}
  }

  function vibrar() {
    if ("vibrate" in navigator) {
      vibInterval = setInterval(() => { navigator.vibrate([200, 100, 200, 100, 500]); }, 1000);
    }
  }

  function pararVibracao() {
    if ("vibrate" in navigator) { clearInterval(vibInterval); navigator.vibrate(0); }
  }

  function irParaTelaCheia() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  function bloquear(e) {
    e.preventDefault(); e.stopPropagation(); return false; 
  }
  
  const eventos = ['keydown','keyup','keypress','wheel','contextmenu','copy','cut','dragstart','selectstart','touchmove','touchstart','touchend','gesturestart', 'scroll'];
  
  function ativarBloqueio() {
    eventos.forEach(ev => document.addEventListener(ev, bloquear, {passive:false, capture:true}));
    window.addEventListener('scroll', bloquear, {passive:false});
  }
  
  function desativarBloqueio() {
    eventos.forEach(ev => document.removeEventListener(ev, bloquear, {capture:true}));
    window.removeEventListener('scroll', bloquear);
  }

  function segurarVoltar() {
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      if (isActive) { history.pushState(null, null, location.href); }
    };
  }

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    lockScreen.classList.add('active');
    isActive = true;
    
    irParaTelaCheia();
    tocarSirene();
    vibrar();
    ativarBloqueio();
    segurarVoltar();
    
    lockLoop = setInterval(() => {
      if (isActive) {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
           irParaTelaCheia();
        }
      }
    }, 100);

    timerInterval = setInterval(() => {
      segundosRestantes--;
      timerEl.textContent = segundosRestantes;
      
      if (segundosRestantes === 3) {
        glitchText.textContent = "DELETANDO...";
        glitchText.style.color = "#fff";
      }
      
      if (segundosRestantes <= 0) {
        liberar();
      }
    }, 1000);
  });

  function liberar() {
    isActive = false;
    clearInterval(timerInterval);
    clearInterval(lockLoop);
    pararAudio();
    pararVibracao();
    desativarBloqueio();
    window.onpopstate = null;
    
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    
    lockScreen.classList.remove('active');
    
    // AQUI ESTÁ A MENSAGEM FINAL COM O NOME DO CHUKITOS
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100vh;align-items:center;justify-content:center;background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px;">
        <div style="font-size:2.5rem; font-weight:900; text-shadow: 0 0 10px #0f0;">PEGADINHA 😂</div>
        <div style="font-size:1rem;color:#aaa;margin-top:10px;">Seus arquivos estão seguros. (brincadeira)</div>
        <div style="font-size:1.5rem;color:#f00; margin-top:40px; font-weight:bold; text-shadow: 0 0 10px red;">Feito por: Davi chukitos</div>
      </div>`;
    document.body.style.cursor = 'default';
  }

  escapeBtn.addEventListener('click', liberar);
  escapeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); liberar(); }, {passive:false});

})();
</script>
</body>
</html>
