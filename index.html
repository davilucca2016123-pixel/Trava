<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erro Fatal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;cursor:none;margin:0;}
  
  #start-screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0a0a0a;color:#ccc;z-index:9998;text-align:center;
  }
  #start-btn{
    margin-top:20px;padding:15px 40px;font-size:1.2rem;font-weight:bold;font-family:inherit;
    background:#d00;color:#fff;border:none;border-radius:5px;cursor:pointer;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,0,0,0.7);}70%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,0,0,0);}100%{transform:scale(1);}}

  #lock-screen{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#000;z-index:9999;color:#f00;text-align:center;width: 100vw; height: 100vh;
  }
  #lock-screen.active{display:flex;}

  /* Tela de Fuga - Se ele apertar F11 e tirar a tela cheia, o texto cobre a tela toda */
  body.fuga #lock-screen {
    background: #000 !important;
  }
  body.fuga .glitch {
    font-size: 15vw !important; /* Fica GIGANTE na tela */
    color: #f00 !important;
    animation: glitch-anim 0.1s infinite !important;
  }
  body.fuga .sub-text, body.fuga .timer {
    display: none; /* Esconde o resto */
  }

  .glitch{
    font-size:clamp(3rem,8vw,6rem);font-weight:900;text-transform:uppercase;
    text-shadow:3px 3px 0 #0f0, -3px -3px 0 #00f;
    animation:glitch-anim 0.2s infinite;
  }
  .sub-text{font-size:1.5rem;color:#aaa;margin-top:15px;letter-spacing:3px;}
  .timer{font-size:5rem;color:#fff;margin-top:30px;font-weight:bold;}
  
  @keyframes glitch-anim{
    0%{transform:translate(0)}
    20%{transform:translate(-8px,8px)}
    40%{transform:translate(-8px,-8px)}
    60%{transform:translate(8px,8px)}
    80%{transform:translate(8px,-8px)}
    100%{transform:translate(0)}
  }

  #escape{
    position:absolute;bottom:15px;left:15px;width:40px;height:40px;
    background:transparent;border:none;cursor:pointer;z-index:10001;opacity:0;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1 style="font-size:2rem;margin-bottom:10px;">Seu PC foi hackeado.</h1>
  <p style="color:#777;">Clique para ver os arquivos.</p>
  <button id="start-btn">INICIAR HACK</button>
</div>

<div id="lock-screen">
  <div class="glitch" id="glitch-text">SISTEMA TRAVADO</div>
  <div class="sub-text">ERRO CRÍTICO 0x000000</div>
  <div class="timer" id="timer">10</div>
  <div class="sub-text" style="margin-top:20px;font-size:1rem;opacity:0.5;">Aguarde...</div>
  <button id="escape"></button>
</div>

<script>
(function(){
  const startScreen = document.getElementById('start-screen');
  const startBtn    = document.getElementById('start-btn');
  const lockScreen  = document.getElementById('lock-screen');
  const timerEl     = document.getElementById('timer');
  const glitchText  = document.getElementById('glitch-text');
  const escapeBtn   = document.getElementById('escape');
  
  let audioCtx, osc, lfo;
  let timerInterval;
  const DURACAO = 10; 
  let segundosRestantes = DURACAO;
  let isActive = false;

  function tocarSirene() {
    try {
      if (!audioCtx || audioCtx.state === 'suspended') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 120; 
        lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 5; 
        lfoGain.gain.value = 80;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.15; 
        osc.start();
        lfo.start();
      }
    } catch(e) {}
  }

  function pararAudio() {
    try {
      if(osc) osc.stop();
      if(audioCtx) audioCtx.close();
      audioCtx = null;
    } catch(e) {}
  }

  function irParaTelaCheia() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  function bloquear(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'w') return; // escape
    e.preventDefault(); e.stopPropagation(); return false; 
  }
  
  const eventos = ['keydown','keyup','keypress','wheel','contextmenu','copy','cut','dragstart','selectstart'];
  
  function ativarBloqueio() {
    eventos.forEach(ev => document.addEventListener(ev, bloquear, {passive:false, capture:true}));
  }
  
  function desativarBloqueio() {
    eventos.forEach(ev => document.removeEventListener(ev, bloquear, {capture:true}));
  }

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    lockScreen.classList.add('active');
    isActive = true;
    
    irParaTelaCheia();
    tocarSirene();
    ativarBloqueio();
    
    timerInterval = setInterval(() => {
      segundosRestantes--;
      timerEl.textContent = segundosRestantes;
      
      if (segundosRestantes === 3) {
        glitchText.textContent = "DELETANDO...";
        glitchText.style.color = "#fff";
      }
      
      if (segundosRestantes <= 0) {
        liberar();
      }
    }, 1000);
  });

  function liberar() {
    isActive = false;
    clearInterval(timerInterval);
    pararAudio();
    desativarBloqueio();
    
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    
    document.body.classList.remove('fuga');
    lockScreen.classList.remove('active');
    
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;height:100vh;align-items:center;justify-content:center;background:#000;color:#0f0;font-family:monospace;font-size:2rem;text-align:center;">PEGADINHA 😂<br><br><span style="font-size:1rem;color:#aaa;">Seus arquivos estão seguros. (brincadeira)</span></div>';
    document.body.style.cursor = 'default';
  }

  escapeBtn.addEventListener('click', liberar);

  // Se o F11 for apertado (sair da tela cheia), o texto vira um monstro na tela
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && isActive) {
      document.body.classList.add('fuga');
    }
  });

})();
</script>
</body>
</html>
